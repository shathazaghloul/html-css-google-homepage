<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Home Page</title>
    <link rel="stylesheet" href="Styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <div class="nav-container">
            <a class="text-link" target="_blank" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
                <P>Random</P>
            </a>
            <a class="text-link" target="_blank" href="https://store.google.com/?hl=en-US&pli=1">
                <P>Store</P>
            </a>
        </div>
        <nav class="nav-container nav-container-second">
            <a class="text-link" target="_blank" href="https://mail.google.com/mail">
                <p>Gmail</p></a>
            <a class="text-link" target="_blank" href="https://www.critterconnection.cc/images/sliders/2018/1.jpg" alt="cute-hedgehog">
                <p>Important Images</p></a>
            <a class="icon-link" target="_blank" href="https://labs.google.com/search?authuser=0">
                <i class="fa-solid fa-flask"></i></a>
            <a class="icon-link" target="blank" href="https://www.youtube.com/watch?v=PHm_B_idud8">
                <i class="fa-solid fa-ellipsis-vertical"></i></a>
            <button class="img-button">
                <img src="/public/profile-picture.jpg" alt="profile-picture" />
            </button>
        </nav>
    </header>
    <main>
        <h1 class="title-text">Google</h1>
        <div class="input-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input title="Search"/>
            <div>
                <button class="input-icon">
                    <i class="fa-solid fa-microphone"></i>    
                </button>
                <button class="input-icon">
                    <i class="fa-solid fa-camera"></i>   
                </button>   
            </div> 
        </div>
        <div class="button-grid">
            <button>
                <p>Google Search</p>
            </button>
            <button>
                <p>I'm Feeling Lucky</p>
            </button>
        </div>
        <p class="language-text"> Google offered in: <a class="language-link">Maori</a></p>
    </main>
    <footer>
        <div>
            <p>
               United States
            </p>
            
        </div>
        <hr/>
        <div class="footer-grid">
             <div class="footer-links">
                <a href="/" target="_blank">
                    <p> Advertising</p>
                </a>
                <a href="/" target="_blank">
                    <p> Business</p>
                </a>
                <a href="/" target="_blank">
                    <p> How Search Works</p>
                </a>
             </div>
             <div class="footer-links">
                <a href="/" target="_blank">
                    <p> Privacy</p>
                </a>
                <a href="" target="_blank">
                    <p> Terms</p>
                </a>
                <a href="/" target="_blank">
                    <p> Settings</p>
                </a>
             </div>
        </div>
    </footer>
</body>
</html>
